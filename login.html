<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — District Sports</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- ========== SIMPLE LOGIN BOX ========== -->
  <main class="login-page">
    <div class="login-box">

      <div class="logo">
        <span>🏆</span>
        <h1>District Sports</h1>
        <p>Admin Login</p>
      </div>

      <!-- Error message (hidden by default) -->
      <p id="error" class="error"></p>

      <form id="loginForm">
        <div>
          <label for="email">Admin Email</label>
          <input id="email" type="email" placeholder="admin@gmail.com" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-green">Login as Admin</button>
      </form>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <span>•</span>
        <a href="index.html">Back to Home</a>
      </div>

      <!-- Hint for demo / class project -->
      <p class="hint">Demo: admin@gmail.com / 123456</p>

    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
