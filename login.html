<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — District Sports</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- ========== SHARED LOGIN BOX (all roles) ========== -->
  <main class="login-page">
    <div class="login-box">

      <div class="logo">
        <span>🏆</span>
        <h1>District Sports</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Error message (empty until something goes wrong) -->
      <p id="error" class="error" role="alert" aria-live="polite"></p>

      <form id="loginForm" novalidate>
        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com"
                 autocomplete="username" required>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" placeholder="Enter password"
                   autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="pw-toggle"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-green">Login</button>
      </form>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <span>•</span>
        <a href="index.html">Back to Home</a>
      </div>

      <!-- Demo accounts: click one to fill the form -->
      <div class="demo-accounts">
        <p class="demo-title">Demo accounts — click to fill</p>
        <button type="button" class="demo-row" data-email="admin@districtsports.com">
          <b>👨‍💼 Super Admin</b>
          <span>admin@districtsports.com / 123456</span>
        </button>
        <button type="button" class="demo-row" data-email="clubadmin@districtsports.com">
          <b>🏟️ Club Admin</b>
          <span>clubadmin@districtsports.com / 123456</span>
        </button>
        <button type="button" class="demo-row" data-email="player@gmail.com">
          <b>🧑‍🎽 Player</b>
          <span>player@gmail.com / 123456</span>
        </button>
      </div>

      <p class="hint">Login is verified by Supabase Auth.</p>

    </div>
  </main>

  <!-- Supabase: SDK -> project config -> auth helpers -> page logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
