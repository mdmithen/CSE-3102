<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — District Sports</title>
  <link rel="stylesheet" href="css/login.css">
  <style>
    body.login-page-body {
      background: #ffffff;
      color: #1f2937;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .login-page-body .login-page {
      min-height: 100vh;
      padding: 24px;
    }

    .login-page-body .login-box {
      width: 380px;
      max-width: 100%;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #dbe5ee;
      border-radius: 12px;
    }

    .login-page-body .logo { margin-bottom: 24px; }
    .login-page-body .logo h1 { margin-top: 0; color: #1f2937; }
    .login-page-body .logo p,
    .login-page-body .demo-title,
    .login-page-body .demo-row span,
    .login-page-body .hint { color: #64748b; }

    .login-page-body label {
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .login-page-body input {
      padding: 11px 12px;
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    .login-page-body input:focus {
      outline: 2px solid #bae6fd;
      border-color: #38bdf8;
    }

    .login-page-body .btn {
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
    }

    .login-page-body .btn-green {
      background: #0284c7;
      color: #ffffff;
    }

    .login-page-body .btn-green:hover { background: #0369a1; }

    .login-page-body .pw-toggle {
      background: #ffffff;
      color: #0369a1;
      border-color: #cbd5e1;
    }

    .login-page-body .pw-toggle:hover,
    .login-page-body .demo-row:hover,
    .login-page-body .demo-row.is-selected {
      border-color: #38bdf8;
    }

    .login-page-body .demo-row {
      background: #ffffff;
      color: #1f2937;
      border-color: #dbe5ee;
      border-radius: 6px;
      font-family: inherit;
    }

    .login-page-body .demo-row.is-selected { background: #f0f9ff; }
    .login-page-body .links a { color: #0369a1; }
    .login-page-body .links span { color: #94a3b8; }

    .login-page-body .hint {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .login-page-body .error { color: #b91c1c; }

    @media (max-width: 480px) {
      .login-page-body .login-box { padding: 24px 20px; }
    }
  </style>
</head>
<body class="login-page-body">

  <!-- ========== SHARED LOGIN BOX (all roles) ========== -->
  <main class="login-page">
    <div class="login-box">

      <div class="logo">
        <h1>District Sports</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Error message (empty until something goes wrong) -->
      <p id="error" class="error" role="alert" aria-live="polite"></p>

      <form id="loginForm" novalidate>
        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com"
                 autocomplete="username" required>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" placeholder="Enter password"
                   autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="pw-toggle"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-green">Login</button>
      </form>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <span>•</span>
        <a href="signup.html">Sign up as Player</a>
        <span>•</span>
        <a href="index.html">Back to Home</a>
      </div>

      <!-- Demo accounts: click one to fill the form -->
      <div class="demo-accounts">
        <p class="demo-title">Demo accounts — click to fill</p>
        <button type="button" class="demo-row" data-email="admin@districtsports.com">
          <b>Super Admin</b>
          <span>admin@districtsports.com / 123456</span>
        </button>
        <button type="button" class="demo-row" data-email="clubadmin@districtsports.com">
          <b>Club Admin</b>
          <span>clubadmin@districtsports.com / 123456</span>
        </button>
        <button type="button" class="demo-row" data-email="player@gmail.com">
          <b>Player</b>
          <span>player@gmail.com / 123456</span>
        </button>
      </div>

      <p class="hint">Login is verified by Supabase Auth.</p>

    </div>
  </main>

  <!-- Supabase: SDK -> project config -> auth helpers -> page logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script>
    (function () {
      var errorBox = document.getElementById("error");
      if (!errorBox) return;

      var removeStatusEmoji = function () {
        var message = errorBox.textContent;
        var cleanMessage = message.replace(/^(?:\u274C|\u26A0\uFE0F|\u23F3)\s*/, "");
        if (cleanMessage !== message) errorBox.textContent = cleanMessage;
      };

      new MutationObserver(removeStatusEmoji).observe(errorBox, {
        childList: true,
        characterData: true,
        subtree: true
      });
      removeStatusEmoji();
    })();
  </script>
</body>
</html>
