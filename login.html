<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — District Sports</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page-body">

  <!-- ========== SHARED LOGIN BOX (all roles) ========== -->
  <main class="login-page">
    <div class="login-box">
      <a class="login-home-link" href="index.html">Back to home</a>

      <div class="logo">
        <span class="login-brand-mark" aria-hidden="true">DS</span>
        <h1>District Sports</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Error message (empty until something goes wrong) -->
      <p id="error" class="error" role="alert" aria-live="polite"></p>

      <form id="loginForm" novalidate>
        <div>
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com"
                 autocomplete="username" required>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" placeholder="Enter password"
                   autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="pw-toggle"
                    aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-green">Login</button>
      </form>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <span>•</span>
        <a href="signup.html">Sign up as Player</a>
      </div>

      <!-- Demo accounts: click one to fill the form -->
      <div class="demo-accounts">
        <p class="demo-title">Demo account shortcuts</p>
        <button type="button" class="demo-row" data-email="admin@districtsports.com">
          <b>Super Admin</b>
          <span>Fill demo sign-in details</span>
        </button>
        <button type="button" class="demo-row" data-email="clubadmin@districtsports.com">
          <b>Club Admin</b>
          <span>Fill demo sign-in details</span>
        </button>
        <button type="button" class="demo-row" data-email="player@gmail.com">
          <b>Player</b>
          <span>Fill demo sign-in details</span>
        </button>
      </div>

      <p class="hint">Login is verified by Supabase Auth.</p>

    </div>
  </main>

  <!-- Supabase: SDK -> project config -> auth helpers -> page logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script>
    (function () {
      var errorBox = document.getElementById("error");
      if (!errorBox) return;

      var removeStatusEmoji = function () {
        var message = errorBox.textContent;
        var cleanMessage = message.replace(/^(?:\u274C|\u26A0\uFE0F|\u23F3)\s*/, "");
        if (cleanMessage !== message) errorBox.textContent = cleanMessage;
      };

      new MutationObserver(removeStatusEmoji).observe(errorBox, {
        childList: true,
        characterData: true,
        subtree: true
      });
      removeStatusEmoji();
    })();
  </script>
</body>
</html>
